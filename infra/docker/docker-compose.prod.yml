name: depi-smart-inventory-prod
services:
  db:
    image: postgres:16-alpine
    container_name: smart_inventory_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-inventory_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # تم التعديل لحسابك على Docker Hub
    image: abdelrahman1212aa/smart-inventory-api:latest
    container_name: smart_inventory_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-inventory_prod}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - inventory_network
    depends_on:
      db:
        condition: service_healthy

  inventory-api:
    # تم التعديل لحسابك على Docker Hub
    image: abdelrahman1212aa/smart-inventory-api:latest
    container_name: smart_inventory_service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-inventory_prod}
      - PORT=5001
    networks:
      - inventory_network
    depends_on:
      db:
        condition: service_healthy

  alert-api:
    # تم التعديل لحسابك على Docker Hub
    image: abdelrahman1212aa/smart-alert-api:latest
    container_name: smart_alert_service
    restart: always
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-inventory_prod}
      - PORT=5002
    networks:
      - inventory_network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # تم التعديل لحسابك على Docker Hub
    image: abdelrahman1212aa/smart-inventory-ui:latest
    container_name: smart_inventory_ui
    restart: always
    ports:
      - "80:80"
    networks:
      - inventory_network
    depends_on:
      - backend
      - inventory-api
      - alert-api

networks:
  inventory_network:
    driver: bridge

volumes:
  pg_data:
  uploads_data: