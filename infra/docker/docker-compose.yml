services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    container_name: smart_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-102030}
      POSTGRES_DB: ${DB_NAME:-inventory_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend API ───
  backend:
    build:
      context: ../../
      dockerfile: services/backend/api/Dockerfile
    container_name: smart_inventory_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-102030}
      - DB_NAME=${DB_NAME:-inventory_dashboard}
      - JWT_SECRET=${JWT_SECRET:-inventory_dashboard_super_secret_key_2024}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-inventory_dashboard_refresh_secret_key_2024}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - inventory_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Inventory Microservice ───
  inventory-api:
    build:
      context: ../../
      dockerfile: services/backend/inventory-api/Dockerfile
    container_name: smart_inventory_service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-102030}
      - DB_NAME=${DB_NAME:-inventory_dashboard}
      - PORT=5001
    networks:
      - inventory_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Alert Microservice ───
  alert-api:
    build:
      context: ../../
      dockerfile: services/backend/alert-api/Dockerfile
    container_name: smart_alert_service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-102030}
      - DB_NAME=${DB_NAME:-inventory_dashboard}
      - PORT=5002
    networks:
      - inventory_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend (Nginx) ───
  frontend:
    build:
      context: ../../
      dockerfile: services/frontend/Dockerfile
    container_name: smart_inventory_ui
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - inventory_network
    depends_on:
      - backend
      - inventory-api
      - alert-api

networks:
  inventory_network:
    driver: bridge

volumes:
  pg_data:
  uploads_data:
