apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
type: Opaque
stringData:
  db-host: "postgres-svc"
  db-user: "postgres"
  db-password: "102030"
  db-name: "inventory_dashboard"
  jwt-secret: "inventory_dashboard_super_secret_key_2024"
  jwt-refresh-secret: "inventory_dashboard_refresh_secret_key_2024"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: inventory-backend-svc
spec:
  rules:
    - host: inventory.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: inventory-backend-svc
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: inventory-backend-svc
                port:
                  number: 5000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: inventory-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-frontend-svc
                port:
                  number: 80
