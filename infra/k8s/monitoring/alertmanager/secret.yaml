---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: smart-inventory
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'abdelrahmanelbahnsy3@gmail.com'
      smtp_auth_username: 'abdelrahmanelbahnsy3@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/gmail/password'
      smtp_require_tls: true

    route:
      receiver: email-notifications

    receivers:
      - name: default
      - name: email-notifications
        email_configs:
          - to: 'abdelrahmanelbahnsy3@gmail.com'
