apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: smart-inventory
    app.kubernetes.io/component: monitoring
data:
  grafana.ini: |
    [server]
    root_url = http://grafana.smartinventory.local

    [users]
    allow_sign_up = false