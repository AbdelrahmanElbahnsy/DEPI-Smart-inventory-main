apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: smart-inventory
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: smart-inventory
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP