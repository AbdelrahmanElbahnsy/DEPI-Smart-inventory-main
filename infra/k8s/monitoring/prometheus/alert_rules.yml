groups:
  - name: infrastructure.rules
    rules:

      - alert: NodeDown
        expr: up{job="kubernetes-service-endpoints"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter Down"
          description: "{{ $labels.instance }} is unreachable."

      - alert: HighCPUUsage
        expr: (100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage"
          description: "CPU usage is above 80%."

      - alert: HighMemoryUsage
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage"
          description: "Memory usage is above 80%."

      - alert: DiskUsageHigh
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk Almost Full"
          description: "Disk usage exceeded 85%."

      - alert: PostgreSQLExporterDown
        expr: up{service="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Exporter Down"
          description: "PostgreSQL exporter is unreachable."

      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pod Restarting"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted within the last 10 minutes."

      - alert: CrashLoopBackOff
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CrashLoopBackOff"
          description: "Container {{ $labels.container }} in Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."

      - alert: PodPending
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod Pending"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for more than 5 minutes."

      - alert: DeploymentUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Deployment Unavailable"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas."

      - alert: OOMKilled
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container OOMKilled"
          description: "Container {{ $labels.container }} in Pod {{ $labels.namespace }}/{{ $labels.pod }} was terminated due to Out Of Memory."