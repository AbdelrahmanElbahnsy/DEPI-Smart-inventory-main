---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: smart-inventory
    app.kubernetes.io/component: monitoring
rules:
- apiGroups: [""]
  resources:
    - nodes
    - nodes/metrics
    - services
    - endpoints
    - pods
  verbs:
    - get
    - list
    - watch
- nonResourceURLs:
    - /metrics
  verbs:
    - get
