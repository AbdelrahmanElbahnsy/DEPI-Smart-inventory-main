---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: smart-inventory
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - api_version: v2
          path_prefix: /alertmanager
          static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    scrape_configs:
      - job_name: 'prometheus'
        metrics_path: /prometheus/metrics
        static_configs:
          - targets:
              - localhost:9090

      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service

      - job_name: 'backend'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: default
        metrics_path: /metrics
        scrape_interval: 15s
        scheme: http

      - job_name: 'inventory-api'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: inventory-api
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: default
        metrics_path: /metrics
        scrape_interval: 15s
        scheme: http

      - job_name: 'alert-api'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: alert-api
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: default
        metrics_path: /metrics
        scrape_interval: 15s
        scheme: http

  alert_rules.yml: |
    groups:
      - name: infrastructure.rules
        rules:

          - alert: NodeDown
            expr: up{job="kubernetes-service-endpoints"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Node Exporter Down"
              description: "{{ $labels.instance }} is unreachable."

          - alert: HighCPUUsage
            expr: (100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU Usage"
              description: "CPU usage is above 80%."

          - alert: HighMemoryUsage
            expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High Memory Usage"
              description: "Memory usage is above 80%."

          - alert: DiskUsageHigh
            expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 15
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Disk Almost Full"
              description: "Disk usage exceeded 85%."

          - alert: PostgreSQLExporterDown
            expr: up{service="postgres-exporter"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL Exporter Down"
              description: "PostgreSQL exporter is unreachable."

          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod Restarting"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted within the last 10 minutes."

          - alert: CrashLoopBackOff
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "CrashLoopBackOff"
              description: "Container {{ $labels.container }} in Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."

          - alert: PodPending
            expr: kube_pod_status_phase{phase="Pending"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod Pending"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for more than 5 minutes."

          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Deployment Unavailable"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas."

          - alert: OOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Container OOMKilled"
              description: "Container {{ $labels.container }} in Pod {{ $labels.namespace }}/{{ $labels.pod }} was terminated due to Out Of Memory."

      - name: application.rules
        rules:
          - alert: BackendDown
            expr: up{service="backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend API Down"
              description: "Backend API has been unreachable for more than one minute."

          - alert: InventoryAPIDown
            expr: up{service="inventory-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Inventory API Down"
              description: "Inventory API has been unreachable for more than one minute."

          - alert: AlertAPIDown
            expr: up{service="alert-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Alert API Down"
              description: "Alert API has been unreachable for more than one minute."

          - alert: HighResponseTime
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le,route)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Response Time"
              description: "95th percentile response time exceeded one second."

          - alert: HighHTTP5xxRate
            expr: sum(rate(http_response_status_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP 5xx Error Rate"
              description: "More than 5% of HTTP requests are returning 5xx responses."
