apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml

configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
      - alert_rules.yml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: smart-inventory
    app.kubernetes.io/component: monitoring
