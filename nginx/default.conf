upstream backend_api {
    server backend:5000;
}

upstream inventory_api {
    server inventory-api:5001;
}

upstream alert_api {
    server alert-api:5002;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ───
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Backend API Proxy ───
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    # ─── Socket.IO Proxy ───
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Inventory Microservice Proxy ───
    location /inventory-api/ {
        rewrite ^/inventory-api/(.*) /$1 break;
        proxy_pass http://inventory_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Alert Microservice Proxy ───
    location /alert-api/ {
        rewrite ^/alert-api/(.*) /$1 break;
        proxy_pass http://alert_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Static Assets (cache aggressively) ───
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── SPA Fallback — All routes → index.html ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Health Check ───
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }
}
